name = "mina-ai-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
preview_urls = true

[vars]
ALLOWED_ORIGINS = "https://teknomail2025.github.io,http://localhost:8000,http://127.0.0.1:8000"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_COMPLEX_MODEL = "gemini-3.8-flash"
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
GEMINI_SECONDARY_FALLBACK_MODEL = "gemini-3.1-flash-lite"
GEMINI_IMAGE_MODEL = "gemini-nano-banana-2.1"
GEMINI_IMAGE_FALLBACK_MODEL = "gemini-3.1-flash-image"
GEMINI_IMAGE_SECONDARY_FALLBACK_MODEL = "gemini-3.1-flash-lite-image"
GEMINI_LIVE_MODEL = "gemini-3.8-live"
CHAT_DAILY_LIMIT = "100"
IMAGE_GENERATION_DAILY_LIMIT = "10"
IMAGE_ANALYSIS_DAILY_LIMIT = "30"
LIVE_MINUTES_DAILY_LIMIT = "30"
[[d1_databases]]
binding = "MINA_DB"
database_name = "mina-ai-db"
database_id = "bdf7737f-b4b2-4158-982b-b7c7483ca702"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MINA_FILES"
bucket_name = "mina-temporary-files"

[triggers]
crons = ["*/15 * * * *"]

[previews]

[previews.vars]
ALLOWED_ORIGINS = "https://teknomail2025.github.io,http://localhost:8000,http://127.0.0.1:8000"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_COMPLEX_MODEL = "gemini-3.8-flash"
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
GEMINI_SECONDARY_FALLBACK_MODEL = "gemini-3.1-flash-lite"
GEMINI_IMAGE_MODEL = "gemini-nano-banana-2.1"
GEMINI_IMAGE_FALLBACK_MODEL = "gemini-3.1-flash-image"
GEMINI_IMAGE_SECONDARY_FALLBACK_MODEL = "gemini-3.1-flash-lite-image"
GEMINI_LIVE_MODEL = "gemini-3.8-live"
CHAT_DAILY_LIMIT = "100"
IMAGE_GENERATION_DAILY_LIMIT = "10"
IMAGE_ANALYSIS_DAILY_LIMIT = "30"
LIVE_MINUTES_DAILY_LIMIT = "30"
[[previews.d1_databases]]
binding = "MINA_DB"
database_name = "mina-ai-db-preview"
database_id = "a0c9df12-44bc-4e58-866c-25a3651edd66"
migrations_dir = "migrations"

[[previews.r2_buckets]]
binding = "MINA_FILES"
bucket_name = "mina-temporary-files-preview"
