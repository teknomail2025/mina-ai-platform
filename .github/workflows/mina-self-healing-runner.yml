name: Mina self-healing isolated repair

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: Approved Mina diagnosis proposal UUID
        required: true
        type: string
      base_sha:
        description: Exact source commit used to generate the patch
        required: true
        type: string
      patch:
        description: Validated unified diff generated by Mina
        required: true
        type: string
      approval_issued_at:
        description: Short-lived timestamp included in Mina signed approval proof
        required: true
        type: string
      approval_signature:
        description: HMAC proof binding the approved proposal, source commit, patch and timestamp
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate patch in isolated runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and materialize patch
        env:
          PATCH_JSON: ${{ toJSON(inputs.patch) }}
          BASE_SHA: ${{ inputs.base_sha }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          APPROVAL_ISSUED_AT: ${{ inputs.approval_issued_at }}
          APPROVAL_SIGNATURE: ${{ inputs.approval_signature }}
          APPROVAL_SECRET: ${{ secrets.MINA_SELF_HEALING_APPROVAL_SECRET }}
        run: |
          python - <<'PY'
          import hashlib, hmac, json, os, pathlib, re, sys, time
          base_sha = os.environ.get("BASE_SHA", "")
          if not re.fullmatch(r"[0-9a-f]{40}", base_sha):
              sys.exit("Invalid pinned base commit SHA.")
          patch = json.loads(os.environ["PATCH_JSON"])
          if not isinstance(patch, str) or not patch or len(patch) > 40000:
              sys.exit("Patch is empty or exceeds 40 KB.")
          proposal_id = os.environ.get("PROPOSAL_ID", "")
          issued_at = os.environ.get("APPROVAL_ISSUED_AT", "")
          signature = os.environ.get("APPROVAL_SIGNATURE", "")
          secret = os.environ.get("APPROVAL_SECRET", "")
          if not re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", proposal_id):
              sys.exit("Invalid approved proposal id.")
          if not re.fullmatch(r"[0-9]{13}", issued_at) or not re.fullmatch(r"[0-9a-f]{64}", signature):
              sys.exit("Missing or malformed approval proof.")
          if len(secret) < 32:
              sys.exit("Approval verification secret is not configured.")
          issued_ms = int(issued_at)
          if abs(int(time.time() * 1000) - issued_ms) > 600000:
              sys.exit("Approval proof expired; request a fresh diagnosis.")
          patch_sha256 = hashlib.sha256(patch.encode("utf-8")).hexdigest()
          message = "\n".join([proposal_id.lower(), base_sha.lower(), patch_sha256, issued_at]).encode("utf-8")
          expected = hmac.new(secret.encode("utf-8"), message, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, signature):
              sys.exit("Approval proof does not match this proposal, source commit, or patch.")
          allowed = {
              "worker/src/index.js",
              "app.js",
              "auth.js",
              "voice.js",
              "i18n.js",
          }
          paths = []
          current = None
          old_header = False
          new_header = False
          in_hunk = False
          for line in patch.splitlines():
              if line.startswith("diff --git "):
                  if current and not (old_header and new_header):
                      sys.exit("Previous file headers are incomplete.")
                  match = re.fullmatch(r"diff --git a/([^ ]+) b/([^ ]+)", line)
                  if not match or match.group(1) != match.group(2):
                      sys.exit("Rename, create/delete, or malformed diff is forbidden.")
                  current = match.group(1)
                  if current not in allowed or current in paths:
                      sys.exit("Patch contains a path outside the allowlist or a duplicate path.")
                  paths.append(current)
                  old_header = new_header = in_hunk = False
                  continue
              if line.startswith(("new file mode ", "deleted file mode ", "old mode ", "new mode ", "rename from ", "rename to ", "copy from ", "copy to ", "GIT binary patch")):
                  sys.exit("File mode, rename, copy, and binary patches are forbidden.")
              if current and not in_hunk and line.startswith("--- "):
                  if old_header or line != f"--- a/{current}":
                      sys.exit("Unexpected old-file header.")
                  old_header = True
              elif current and not in_hunk and line.startswith("+++ "):
                  if not old_header or new_header or line != f"+++ b/{current}":
                      sys.exit("Unexpected new-file header.")
                  new_header = True
              elif current and line.startswith("@@ "):
                  if not (old_header and new_header):
                      sys.exit("Unified diff headers are incomplete.")
                  in_hunk = True
          if current and not (old_header and new_header):
              sys.exit("Final file headers are incomplete.")
          if not paths or len(paths) > 5:
              sys.exit("Patch must change between one and five allowlisted files.")
          if "@@" not in patch:
              sys.exit("Unified diff hunks are missing.")
          pathlib.Path(os.environ["RUNNER_TEMP"], "mina-repair.patch").write_text(patch, encoding="utf-8")
          print("Validated paths:", ", ".join(paths))
          PY
          git merge-base --is-ancestor "$BASE_SHA" origin/main || { echo "Pinned source commit is not part of the trusted repair branch." >&2; exit 1; }
          git switch --detach "$BASE_SHA"
          git apply --check "$RUNNER_TEMP/mina-repair.patch"
      - name: Apply patch in disposable test job
        run: git apply "$RUNNER_TEMP/mina-repair.patch"
      - name: Check JavaScript syntax
        run: |
          node --check worker/src/index.js
          node --check app.js
          node --check auth.js
          node --check voice.js
          node --check i18n.js
      - name: Run regression and self-healing tests
        run: node --test worker/test/*.test.cjs $(find worker/test -name '*.test.mjs' -print)
      - name: Validate Worker bundle without deployment
        run: npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.production.toml
      - name: Upload validated patch
        uses: actions/upload-artifact@v4
        with:
          name: mina-repair-patch
          path: ${{ runner.temp }}/mina-repair.patch
          if-no-files-found: error
          retention-days: 3

  create-review-pull-request:
    name: Create review-only repair PR
    needs: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
      - name: Download validated patch
        uses: actions/download-artifact@v4
        with:
          name: mina-repair-patch
          path: ${{ runner.temp }}/mina-repair
      - name: Create isolated repair branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "Repair branch checkout does not match the tested source SHA." >&2; exit 1; }
          git fetch origin main --quiet
          git merge-base --is-ancestor "$BASE_SHA" origin/main || { echo "Tested source SHA is no longer an ancestor of main; rerun diagnosis." >&2; exit 1; }
          if [[ ! "$PROPOSAL_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Invalid proposal id." >&2
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/mina-repair/mina-repair.patch"
          git apply "$RUNNER_TEMP/mina-repair/mina-repair.patch"
          git add -- worker/src/index.js app.js auth.js voice.js i18n.js
          if git diff --cached --quiet; then
            echo "Validated patch produced no changes." >&2
            exit 1
          fi
          BRANCH="mina/self-healing-$PROPOSAL_ID"
          git config user.name "mina-self-healing[bot]"
          git config user.email "mina-self-healing[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "Mina self-healing: validated repair $PROPOSAL_ID"
          git push origin "$BRANCH"
          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY'
          ## Automated isolated validation

          Mina generated this patch from an administrator-approved diagnosis. The patch passed the isolated regression suite, JavaScript syntax checks, and Wrangler dry-run.

          **No merge or deployment was performed.** Review the diff manually before merging.
          BODY
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Mina self-healing: validated repair $PROPOSAL_ID" \
            --body-file "$RUNNER_TEMP/pr-body.md"

