name: Mina self-healing isolated repair

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: Approved Mina diagnosis proposal UUID
        required: true
        type: string
      base_sha:
        description: Exact source commit used to generate the patch
        required: true
        type: string
      patch:
        description: Validated unified diff generated by Mina
        required: true
        type: string
      approval_issued_at:
        description: Short-lived timestamp included in Mina signed approval proof
        required: true
        type: string
      approval_signature:
        description: HMAC proof binding the approved proposal, source commit, patch and timestamp
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate patch in isolated runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and materialize patch
        env:
          PATCH_JSON: ${{ toJSON(inputs.patch) }}
          BASE_SHA: ${{ inputs.base_sha }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          APPROVAL_ISSUED_AT: ${{ inputs.approval_issued_at }}
          APPROVAL_SIGNATURE: ${{ inputs.approval_signature }}
          APPROVAL_SECRET: ${{ secrets.MINA_SELF_HEALING_APPROVAL_SECRET }}
        run: python worker/scripts/validate_self_healing_patch.py
          git merge-base --is-ancestor "$BASE_SHA" origin/main || { echo "Pinned source commit is not part of the trusted repair branch." >&2; exit 1; }
          git switch --detach "$BASE_SHA"
          git apply --check "$RUNNER_TEMP/mina-repair.patch"
      - name: Apply patch in disposable test job
        run: git apply "$RUNNER_TEMP/mina-repair.patch"
      - name: Check JavaScript syntax
        run: |
          node --check worker/src/index.js
          node --check app.js
          node --check media.js
          node --check auth.js
          node --check voice.js
          node --check i18n.js
      - name: Run regression and self-healing tests
        run: node --test worker/test/*.test.cjs $(find worker/test -name '*.test.mjs' -print)
      - name: Validate Worker bundle without deployment
        run: npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.production.toml
      - name: Upload validated patch
        uses: actions/upload-artifact@v4
        with:
          name: mina-repair-patch
          path: ${{ runner.temp }}/mina-repair.patch
          if-no-files-found: error
          retention-days: 3

  create-review-pull-request:
    name: Create review-only repair PR
    needs: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout exact validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
      - name: Download validated patch
        uses: actions/download-artifact@v4
        with:
          name: mina-repair-patch
          path: ${{ runner.temp }}/mina-repair
      - name: Create isolated repair branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || { echo "Repair branch checkout does not match the tested source SHA." >&2; exit 1; }
          git fetch origin main --quiet
          git merge-base --is-ancestor "$BASE_SHA" origin/main || { echo "Tested source SHA is no longer an ancestor of main; rerun diagnosis." >&2; exit 1; }
          if [[ ! "$PROPOSAL_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Invalid proposal id." >&2
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/mina-repair/mina-repair.patch"
          git apply "$RUNNER_TEMP/mina-repair/mina-repair.patch"
          git add -- worker/src/index.js app.js auth.js voice.js i18n.js
          if git diff --cached --quiet; then
            echo "Validated patch produced no changes." >&2
            exit 1
          fi
          BRANCH="mina/self-healing-$PROPOSAL_ID"
          git config user.name "mina-self-healing[bot]"
          git config user.email "mina-self-healing[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "Mina self-healing: validated repair $PROPOSAL_ID"
          git push origin "$BRANCH"
          cat > "$RUNNER_TEMP/pr-body.md" <<'BODY'
          ## Automated isolated validation

          Mina generated this patch from an administrator-approved diagnosis. The patch passed the isolated regression suite, JavaScript syntax checks, and Wrangler dry-run.

          **No merge or deployment was performed.** Review the diff manually before merging.
          BODY
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Mina self-healing: validated repair $PROPOSAL_ID" \
            --body-file "$RUNNER_TEMP/pr-body.md"

