name: Mina self-healing isolated repair

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: Approved Mina diagnosis proposal UUID
        required: true
        type: string
      patch:
        description: Validated unified diff generated by Mina
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate patch in isolated runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: feature/mina-self-healing
          persist-credentials: false
      - name: Validate and materialize patch
        env:
          PATCH_JSON: ${{ toJSON(inputs.patch) }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, sys
          patch = json.loads(os.environ["PATCH_JSON"])
          if not isinstance(patch, str) or not patch or len(patch) > 40000:
              sys.exit("Patch is empty or exceeds 40 KB.")
          allowed = {
              "worker/src/index.js",
              "worker/test/worker.test.cjs",
              "worker/test/voice.test.cjs",
              "app.js",
              "auth.js",
              "voice.js",
              "i18n.js",
          }
          paths = []
          for line in patch.splitlines():
              if line.startswith("diff --git "):
                  match = re.fullmatch(r"diff --git a/([^ ]+) b/([^ ]+)", line)
                  if not match or match.group(1) != match.group(2):
                      sys.exit("Rename, create/delete, or malformed diff is forbidden.")
                  path = match.group(1)
                  if path not in allowed or path in paths:
                      sys.exit("Patch contains a path outside the allowlist or a duplicate path.")
                  paths.append(path)
              if line.startswith(("new file mode ", "deleted file mode ", "old mode ", "new mode ", "rename from ", "rename to ", "copy from ", "copy to ", "GIT binary patch")):
                  sys.exit("File mode, rename, copy, and binary patches are forbidden.")
          if not paths or len(paths) > 5:
              sys.exit("Patch must change between one and five allowlisted files.")
          for path in paths:
              if f"--- a/{path}" not in patch or f"+++ b/{path}" not in patch:
                  sys.exit("Patch file headers are incomplete.")
          if "@@" not in patch:
              sys.exit("Unified diff hunks are missing.")
          pathlib.Path(os.environ["RUNNER_TEMP"], "mina-repair.patch").write_text(patch, encoding="utf-8")
          print("Validated paths:", ", ".join(paths))
          PY
          git apply --check "$RUNNER_TEMP/mina-repair.patch"
      - name: Apply patch in disposable test job
        run: git apply "$RUNNER_TEMP/mina-repair.patch"
      - name: Check JavaScript syntax
        run: |
          node --check worker/src/index.js
          node --check app.js
          node --check auth.js
          node --check voice.js
          node --check i18n.js
      - name: Run regression and self-healing tests
        run: node --test worker/test/*.test.cjs worker/test/*.test.mjs
      - name: Validate Worker bundle without deployment
        run: npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.toml
      - name: Upload validated patch
        uses: actions/upload-artifact@v4
        with:
          name: mina-repair-patch
          path: ${{ runner.temp }}/mina-repair.patch
          if-no-files-found: error
          retention-days: 3

  create-review-pull-request:
    name: Create review-only repair PR
    needs: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: feature/mina-self-healing
      - name: Download validated patch
        uses: actions/download-artifact@v4
        with:
          name: mina-repair-patch
          path: ${{ runner.temp }}/mina-repair
      - name: Create isolated repair branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_ID: ${{ inputs.proposal_id }}
        run: |
          if [[ ! "$PROPOSAL_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Invalid proposal id." >&2
            exit 1
          fi
          git apply --check "$RUNNER_TEMP/mina-repair/mina-repair.patch"
          git apply "$RUNNER_TEMP/mina-repair/mina-repair.patch"
          git add -- worker/src/index.js worker/test/worker.test.cjs worker/test/voice.test.cjs app.js auth.js voice.js i18n.js
          if git diff --cached --quiet; then
            echo "Validated patch produced no changes." >&2
            exit 1
          fi
          BRANCH="mina/self-healing-$PROPOSAL_ID"
          git config user.name "mina-self-healing[bot]"
          git config user.email "mina-self-healing[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "Mina self-healing: validated repair $PROPOSAL_ID"
          git push origin "$BRANCH"
          gh pr create \
            --base feature/mina-self-healing \
            --head "$BRANCH" \
            --title "Mina self-healing: validated repair $PROPOSAL_ID" \
            --body "## Automated isolated validation\n\nMina generated this patch from an administrator-approved diagnosis. The patch passed the isolated regression suite, JavaScript syntax checks, and Wrangler dry-run.\n\n**No merge or deployment was performed.** Review the diff manually before merging."
