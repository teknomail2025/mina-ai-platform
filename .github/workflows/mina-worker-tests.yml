name: Mina Worker tests

on:
  pull_request:
    branches:
      - main
      - fix/image-pipeline-and-usage-quotas
      - feat/r2-temporary-file-storage
  push:
    branches:
      - main
      - fix/image-pipeline-and-usage-quotas
      - feat/r2-temporary-file-storage

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check worker/src/index.js
      - name: Check frontend syntax
        run: node --check app.js
      - name: Run Worker regression tests
        run: node --test worker/test/*.test.cjs worker/test/*.test.mjs
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.production.toml
