name: Test Mina changes
on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "app.js"
      - "voice.js"
      - ".github/workflows/test-pr.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker and run tests
        run: |
          node --check worker/src/index.js
          node --check voice.js
          node --test worker/test/*.test.cjs worker/test/*.test.mjs
          npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.production.toml
