name: Test Mina changes
on:
  pull_request:
    branches: [main]
    paths:
      - "worker/**"
      - "app.js"
      - "index.html"
      - "media.js"
      - "i18n.js"
      - "auth.js"
      - "pwa.js"
      - "sw.js"
      - "voice.js"
      - "mobile/**"
      - ".github/workflows/test-pr.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker and run tests
        run: |
          node --check worker/src/index.js
          node --check voice.js
          node --test worker/test/*.test.cjs
          npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.production.toml
          npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Start isolated local Worker and static frontend
        run: |
          cd worker
          npx --yes wrangler@4 d1 migrations apply mina-ai-db --local --config wrangler.production.toml
          setsid npx --yes wrangler@4 dev --config wrangler.production.toml --local --ip 127.0.0.1 --port 8787 \
            --var ADMIN_USERNAME:Argion \
            --var ADMIN_PASSWORD:ci-test-password-at-least-12 \
            --var SESSION_SECRET:ci-session-secret-at-least-32-characters-long \
            --var GEMINI_API_KEY:ci-fake-gemini-key > /tmp/mina-browser-worker.log 2>&1 &
          WRANGLER_PID=$!
          cd ..
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/mina-browser-http.log 2>&1 &
          HTTP_PID=$!
          cleanup() {
            kill "$HTTP_PID" 2>/dev/null || true
            wait "$HTTP_PID" 2>/dev/null || true
            kill -- "-$WRANGLER_PID" 2>/dev/null || kill "$WRANGLER_PID" 2>/dev/null || true
            wait "$WRANGLER_PID" 2>/dev/null || true
            rm -rf worker/.wrangler
          }
          trap cleanup EXIT
          READY=false
          for i in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8787/api/health >/dev/null && curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8000/ >/dev/null; then READY=true; break; fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "Local Worker or static server did not become ready."
            cat /tmp/mina-browser-worker.log || true
            cat /tmp/mina-browser-http.log || true
            exit 1
          fi
          timeout 180s node worker/test/ui-language.browser.cjs
          cat /tmp/mina-browser-worker.log

  platform-foundation:
    name: "${{ matrix.platform }} foundation"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-24.04
            build_command: flutter build apk --debug
          - platform: windows
            runner: windows-latest
            build_command: flutter build windows --debug
          - platform: macos
            runner: macos-latest
            build_command: flutter build macos --debug
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: ${{ runner.os }}-flutter-${{ hashFiles('mobile/pubspec.lock') }}
      - name: Generate native host scaffolding
        run: flutter create --platforms=android,windows,macos --org ai.mina --project-name mina_companion .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build native debug target
        run: ${{ matrix.build_command }}
