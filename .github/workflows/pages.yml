name: Deploy Mina AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check auth.js
          node --check i18n.js
          node --check app.js
          node --check voice.js
          node --check pwa.js
          node --check sw.js
          node --check worker/src/index.js
          node --check worker/test/ui-language.browser.cjs
          node -e "JSON.parse(require('fs').readFileSync('worker/src/training.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.en.webmanifest', 'utf8'))"
          (cd worker && node --test)
      - name: Worker runtime smoke test (startup, auth, shutdown)
        run: |
          cd worker
          npx --yes wrangler@4 d1 migrations apply mina-ai-db --local --config wrangler.production.toml
          npx --yes wrangler@4 dev --config wrangler.production.toml --local --ip 127.0.0.1 --port 8786 \
            --var ADMIN_USERNAME:Argion \
            --var ADMIN_PASSWORD:ci-test-password-at-least-12 \
            --var SESSION_SECRET:ci-session-secret-at-least-32-characters-long \
            --var GEMINI_API_KEY:ci-fake-gemini-key > /tmp/mina-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true; wait "$WRANGLER_PID" 2>/dev/null || true; rm -rf .wrangler' EXIT
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const base = "http://127.0.0.1:8786";
          let ready = false;
          for (let i = 0; i < 60; i++) {
            try {
              const response = await fetch(base + "/api/health");
              if (response.ok) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) console.error(await readFile("/tmp/mina-wrangler.log", "utf8").catch(() => "Wrangler log unavailable"));
          assert.ok(ready, "Wrangler Worker did not start within 60 seconds");
          const health = await fetch(base + "/api/health");
          const healthData = await health.json();
          assert.equal(healthData.ok, true);
          assert.equal(healthData.adminAuthConfigured, true);
          assert.equal(healthData.memoryConfigured, true);
          const guest = await fetch(base + "/api/providers");
          assert.equal(guest.status, 401, "protected API must reject guests");
          const login = await fetch(base + "/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: "Argion", password: "ci-test-password-at-least-12" })
          });
          assert.equal(login.status, 200, "admin login must work in the real Worker runtime");
          const loginData = await login.json();
          assert.ok(loginData.token);
          const profile = await fetch(base + "/api/auth/me", {
            headers: { Authorization: "Bearer " + loginData.token }
          });
          assert.equal(profile.status, 200);
          const profileData = await profile.json();
          assert.equal(profileData.user.username, "Argion");
          const memorySave = await fetch(base + "/api/memory", { method: "PUT", headers: { "Content-Type": "application/json", Authorization: "Bearer " + loginData.token }, body: JSON.stringify({ memory: "CI MinaData persistence check" }) });
          assert.equal(memorySave.status, 200, "authenticated D1 memory write must work");
          const memoryLoad = await fetch(base + "/api/memory", { headers: { Authorization: "Bearer " + loginData.token } });
          assert.equal(memoryLoad.status, 200, "authenticated D1 memory read must work");
          assert.equal((await memoryLoad.json()).memory, "CI MinaData persistence check");
          const preferences = { theme: "light", language: "tr", interfaceLanguage: "en" };
          const preferencesSave = await fetch(base + "/api/preferences", { method: "PUT", headers: { "Content-Type": "application/json", Authorization: "Bearer " + loginData.token }, body: JSON.stringify({ preferences }) });
          assert.equal(preferencesSave.status, 200, "authenticated D1 preferences write must work");
          const preferencesLoad = await fetch(base + "/api/preferences", { headers: { Authorization: "Bearer " + loginData.token } });
          assert.equal(preferencesLoad.status, 200, "authenticated D1 preferences read must work");
          assert.deepEqual((await preferencesLoad.json()).preferences, preferences);
          console.log("Worker startup, health, guest rejection, admin login, session validation, D1 memory and preferences read/write, and shutdown trap: passed");
          NODE
          cat /tmp/mina-wrangler.log

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser UI language runtime test
        timeout-minutes: 5
        run: |
          cd worker
          npx --yes wrangler@4 d1 migrations apply mina-ai-db --local --config wrangler.production.toml
          setsid npx --yes wrangler@4 dev --config wrangler.production.toml --local --ip 127.0.0.1 --port 8787 \
            --var ADMIN_USERNAME:Argion \
            --var ADMIN_PASSWORD:ci-test-password-at-least-12 \
            --var SESSION_SECRET:ci-session-secret-at-least-32-characters-long \
            --var GEMINI_API_KEY:ci-fake-gemini-key > /tmp/mina-browser-worker.log 2>&1 &
          WRANGLER_PID=$!
          cd ..
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/mina-browser-http.log 2>&1 &
          HTTP_PID=$!
          cleanup() {
            kill "$HTTP_PID" 2>/dev/null || true
            wait "$HTTP_PID" 2>/dev/null || true
            kill -- "-$WRANGLER_PID" 2>/dev/null || kill "$WRANGLER_PID" 2>/dev/null || true
            wait "$WRANGLER_PID" 2>/dev/null || true
            rm -rf worker/.wrangler
            echo "Browser static server and local Worker stopped."
          }
          trap cleanup EXIT
          READY=false
          for i in $(seq 1 30); do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8787/api/health >/dev/null && curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:8000/ >/dev/null; then READY=true; break; fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "Local Worker or static server did not become ready."
            cat /tmp/mina-browser-worker.log || true
            cat /tmp/mina-browser-http.log || true
            exit 1
          fi
          echo "Local Worker and static server are ready; starting Playwright checks."
          timeout 180s node worker/test/ui-language.browser.cjs
          echo "Browser app startup, authenticated runtime, TR→EN→TR, response-language independence, settings open/close and browser shutdown: passed"
          cat /tmp/mina-browser-worker.log
      - name: Verify required frontend files
        run: |
          test -s index.html
          test -s styles.css
          test -s i18n.js
          test -s app.js
          test -s voice.js
          test -s pwa.js
          test -s sw.js
          test -s manifest.webmanifest
          test -s manifest.en.webmanifest
          test -s app-icon.svg
          test -s worker/wrangler.toml
          test -s worker/wrangler.production.toml
          test -s worker/test/worker.test.cjs
          test -s worker/test/ui-language.browser.cjs
          test -s worker/migrations/0001_auth_and_user_data.sql
          test -s worker/migrations/0002_mina_admin_memory.sql
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
