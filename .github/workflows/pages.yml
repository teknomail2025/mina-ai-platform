name: Deploy Mina AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check auth.js
          node --check app.js
          node --check voice.js
          node --check pwa.js
          node --check sw.js
          node --check worker/src/index.js
          node -e "JSON.parse(require('fs').readFileSync('worker/src/training.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8'))"
          node --test worker/test/*.test.cjs
      - name: Worker runtime smoke test (startup, auth, shutdown)
        run: |
          cd worker
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8787 \
            --var ADMIN_USERNAME:Argion \
            --var ADMIN_PASSWORD:ci-test-password-at-least-12 \
            --var SESSION_SECRET:ci-session-secret-at-least-32-characters-long \
            --var GEMINI_API_KEY:ci-fake-gemini-key > /tmp/mina-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true; wait "$WRANGLER_PID" 2>/dev/null || true; rm -rf .wrangler' EXIT
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const base = "http://127.0.0.1:8787";
          let ready = false;
          for (let i = 0; i < 60; i++) {
            try {
              const response = await fetch(base + "/api/health");
              if (response.ok) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) console.error(await readFile("/tmp/mina-wrangler.log", "utf8").catch(() => "Wrangler log unavailable"));
          assert.ok(ready, "Wrangler Worker did not start within 60 seconds");
          const health = await fetch(base + "/api/health");
          const healthData = await health.json();
          assert.equal(healthData.ok, true);
          assert.equal(healthData.adminAuthConfigured, true);
          const guest = await fetch(base + "/api/providers");
          assert.equal(guest.status, 401, "protected API must reject guests");
          const login = await fetch(base + "/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: "Argion", password: "ci-test-password-at-least-12" })
          });
          assert.equal(login.status, 200, "admin login must work in the real Worker runtime");
          const loginData = await login.json();
          assert.ok(loginData.token);
          const profile = await fetch(base + "/api/auth/me", {
            headers: { Authorization: "Bearer " + loginData.token }
          });
          assert.equal(profile.status, 200);
          const profileData = await profile.json();
          assert.equal(profileData.user.username, "Argion");
          console.log("Worker startup, health, guest rejection, admin login, session validation and shutdown trap: passed");
          NODE
          cat /tmp/mina-wrangler.log
      - name: Verify required frontend files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s voice.js
          test -s pwa.js
          test -s sw.js
          test -s manifest.webmanifest
          test -s app-icon.svg
          test -s worker/wrangler.toml
          test -s worker/test/worker.test.cjs
          test -s worker/migrations/0001_auth_and_user_data.sql
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
