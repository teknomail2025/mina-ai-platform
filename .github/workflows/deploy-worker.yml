name: Deploy Mina AI Worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mina-cloudflare-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker and run tests
        run: |
          node --check worker/src/index.js
          node --test worker/test/*.test.cjs $(find worker/test -name '*.test.mjs' -print)
          npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.production.toml
          npx --yes wrangler@4 deploy --dry-run --config worker/wrangler.toml
          npx --yes wrangler@4 deploy --dry-run --config wrangler.toml

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.production.toml
          wranglerVersion: "4"
